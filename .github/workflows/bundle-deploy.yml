# Deploy the bundle and prove the result, on merge to main.
#
# Deploy is gated by the `free-edition` GitHub Environment, so a required
# reviewer can be added there without touching this file.

name: Bundle deploy

on:
  push:
    branches: [main]
    paths:
      - 'my-notes/databricks/**'
      - '.github/workflows/bundle-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-deploy
  cancel-in-progress: false     # never interrupt a deploy mid-flight

jobs:
  deploy:
    # Guard: anyone who forks this fork must not fire jobs at the workspace.
    if: github.repository == 'jschuller/stock-markets-analytics-zoomcamp'
    runs-on: ubuntu-latest
    environment: free-edition
    defaults:
      run:
        working-directory: my-notes/databricks/bundle
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pin the CLI, do not take latest. setup-cli's default installs whatever is
      # newest, and a newer CLI requests a newer databricks/databricks provider —
      # 1.129.0, whose signature the bundled OpenTofu rejects with "authentication
      # signature from unknown issuer", failing `terraform init` after the files
      # have already uploaded. 0.280.0 requests 1.99.0, which is what runs locally.
      # Bump this deliberately, together with the local CLI, never implicitly.
      - uses: databricks/setup-cli@6bb7075f85b326f8b9ce160933dfe9bcd63c8121 # v1.13.0
        with:
          version: 0.280.0

      # 0.280.0 cannot download Terraform for itself:
      #   error downloading Terraform: unable to verify checksums signature:
      #   openpgp: key expired
      # Exactly the failure CLAUDE.md documents for local, so CI takes the same
      # documented workaround: supply the binary and tell the CLI which one.
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false          # DATABRICKS_TF_EXEC_PATH needs the real binary

      - name: Point the Databricks CLI at OpenTofu
        run: |
          # DATABRICKS_TF_VERSION must match the binary exactly, or the CLI
          # refuses it with "expected version is <x>".
          echo "DATABRICKS_TF_EXEC_PATH=$(which tofu)" >> "$GITHUB_ENV"
          echo "DATABRICKS_TF_VERSION=1.12.6"          >> "$GITHUB_ENV"
          tofu version

      - name: Deploy
        run: databricks bundle deploy -t free-edition

      - name: Create tables
        run: databricks bundle run bootstrap_tables -t free-edition

      - name: Verify layout
        run: |
          out="$(databricks bundle run verify_layout -t free-edition 2>&1)"
          echo "$out"
          # The notebook exits with JSON; fail the job unless it says ok:true.
          echo "$out" | python3 -c '
          import sys, re, json
          raw = sys.stdin.read()
          m = re.search(r"(\{.*\})\s*$", raw, re.S)
          if not m:
              sys.exit("verify_layout returned no JSON — treating as failure")
          d = json.loads(m.group(1))
          if not d.get("ok"):
              sys.exit("layout verification FAILED: " + json.dumps(d.get("failures"), indent=2))
          print("layout verified: ok")
          '
