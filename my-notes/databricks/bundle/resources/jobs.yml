# Tables are created by a job, not declaratively.
#
# DAB has no Unity Catalog table resource, so the layout notebook does the DDL.
# The tradeoff is no drift detection on tables — covered instead by
# 04_verify_layout.py, which asserts column names and types.
#
# No cluster spec is what selects serverless. Free Edition has zero clusters,
# so this is the only option there anyway.

resources:
  jobs:
    bootstrap_tables:
      name: "[SMA] Bootstrap ${var.catalog} tables"
      description: >-
        Idempotent DDL for the fixed-schema tables. Safe to re-run on every
        deploy; every statement is CREATE ... IF NOT EXISTS.
      max_concurrent_runs: 1
      tasks:
        - task_key: create_layout
          notebook_task:
            notebook_path: ../src/03_create_layout.py
            base_parameters:
              catalog: ${var.catalog}

    verify_layout:
      name: "[SMA] Verify ${var.catalog} layout"
      description: >-
        Assertion-based check that the deployed layout matches spec. Returns
        JSON with "ok": true/false. Run after bootstrap, and in CI.
      max_concurrent_runs: 1
      tasks:
        - task_key: verify
          notebook_task:
            notebook_path: ../src/04_verify_layout.py
            base_parameters:
              catalog: ${var.catalog}

    ingest_bronze:
      name: "[SMA] Ingest Module 1 data into ${var.catalog}.bronze"
      description: >-
        Fills bronze.ohlcv_daily (yfinance), bronze.macro_series (FRED) and
        bronze.tickers. Idempotent: mode=replace_source clears this source's
        rows first, so re-running reloads rather than duplicating.
      max_concurrent_runs: 1

      # First environments: block in this bundle. yfinance and pandas-datareader
      # are not on the serverless base image, and declaring them here keeps the
      # dependency set in version control and visible in `bundle plan` — better
      # than a %pip cell that only the notebook knows about.
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - yfinance
              - pandas-datareader==0.10.0

      # First schedule: in this bundle, and deliberately PAUSED. Module 5 will
      # want a daily refresh; declaring the intent now costs nothing, and paused
      # means nothing fires until it is asked to. GitHub deploys, Databricks
      # schedules — see ../../../../.github/workflows/README.md.
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED

      tasks:
        - task_key: ingest
          environment_key: default
          notebook_task:
            notebook_path: ../src/05_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              start_date: "1950-01-01"
              mode: replace_source
              groups: all

    crosscheck_bronze:
      name: "[SMA] Cross-check Homework 1 against ${var.catalog}.bronze"
      description: >-
        Answers Homework 1 Q2 and Q3 from bronze.ohlcv_daily and asserts they
        match what homework1.ipynb got from live yfinance. Returns JSON with
        "ok": true/false. Q1 and Q4 are not answerable from bronze and the
        notebook says so rather than skipping them silently.

        No environments: block on purpose — reading Delta needs nothing beyond
        the serverless base image.
      max_concurrent_runs: 1
      tasks:
        - task_key: crosscheck
          notebook_task:
            notebook_path: ../src/06_crosscheck_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              q2_start: "2026-01-01"
              q2_end: "2026-08-21"
              expect_q2: "2"
              expect_q3: "7.99"

    data_quality:
      name: "[SMA] Data quality checks on ${var.catalog}.bronze"
      description: >-
        Asserts the data in bronze is usable, not just that the layout is the
        right shape — freshness, row and ticker counts, (ticker, date)
        uniqueness per source, OHLC internal consistency, null rates and
        universe drift in both directions. Returns JSON with "ok": true/false.

        Deliberately NOT part of the deploy gate. ingest_bronze's schedule is
        paused, so bronze goes stale by design and the freshness check will go
        red on purpose; verify_layout stays the CI gate. Put this on a schedule
        when Module 5 unpauses the pipeline.

        No environments: block, for the same reason as crosscheck_bronze —
        reading Delta needs nothing beyond the serverless base image.
      max_concurrent_runs: 1
      tasks:
        - task_key: data_quality
          notebook_task:
            notebook_path: ../src/07_data_quality.py
            base_parameters:
              catalog: ${var.catalog}
              max_staleness_days: "5"
              macro_max_staleness_days: "10"
              min_ohlcv_rows: "1900000"
              min_tickers: "200"
              max_null_rate_pct: "1.0"
              # Equities and indexes must be internally consistent. Futures close on
              # the exchange settlement price, which legitimately falls outside the
              # day's traded range, so commodity gets a documented allowance.
              max_violation_rate_pct: "0.0"
              commodity_max_violation_rate_pct: "5.0"
              expect_macro_series: "17"
              # The three symbols Yahoo's own chart endpoint 404s. Asserted, not
              # just logged: if this list changes, something changed upstream.
              expect_no_data_tickers: "BK,FI,MMC"

    collect_run_reports:
      name: "[SMA] Collect run reports into ${var.catalog}.ops.job_runs"
      description: >-
        Harvests notebook exit JSON from the Jobs API into ops.job_runs.
        Reads the API rather than having each notebook write its own row:
        notebook.exit() stops execution so the write would have to precede it
        in every notebook, bundle src files cannot import a shared helper, and
        a notebook that dies before its exit line would record nothing —
        which is the run you most want. Idempotent: MERGE on run_id.
      max_concurrent_runs: 1
      tasks:
        - task_key: collect
          notebook_task:
            notebook_path: ../src/08_collect_run_reports.py
            base_parameters:
              catalog: ${var.catalog}
              lookback_days: "30"
              job_name_prefix: "[SMA]"
