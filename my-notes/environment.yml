# Stock Markets Analytics Zoomcamp — local environment
# Colab is the primary environment for live sessions; this is the local
# fallback and the homework/capstone workspace.
#
#   conda env create -f my-notes/environment.yml
#   conda activate stock-markets-analytics
#   python -m ipykernel install --user --name stock-markets-analytics

name: stock-markets-analytics
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # core
  - numpy>=1.24,<3
  # Pinned below 3.0 on purpose: the course notebooks are written for
  # pandas 2.x and Colab still ships 2.x. pandas 3.0 changes copy-on-write
  # semantics and drops deprecated APIs the lectures use.
  - pandas>=2.2,<3
  - scipy>=1.10.0
  # viz
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.0.0
  # notebooks
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  # Module 3: the model (logistic regression, decision tree, random forest)
  - scikit-learn>=1.4.0
  # Module 5: parquet I/O + progress bars in scripts/data_repo.py
  - pyarrow>=15.0.0
  - fastparquet>=2024.2.0
  - tqdm>=4.66.0
  # Modules 3-5 fetch their parquet inputs with `!gdown <id> -O /content/`.
  # Colab preinstalls it; locally it has to be declared or those notebooks
  # fail at the download cell rather than at import time.
  - gdown>=5.0.0
  # Unit tests for my-notes/lib/. Invoke as `python -m pytest`, never bare `pytest`:
  # the `pytest` first on PATH belongs to base miniforge, not this env, so a bare
  # call silently runs the wrong interpreter and cannot import pandas 2.3.
  - pytest>=8
  # data sources / scraping
  - beautifulsoup4>=4.11.0
  - lxml>=5.0.0
  - html5lib>=1.1
  - requests>=2.28.0
  # Technical analysis. conda-forge build, NOT the pip `ta-lib-binary`
  # wheel, which does not reliably build on Apple Silicon.
  # Not needed for Module 1 — drop this line if the solve stalls.
  - ta-lib>=0.4.0
  - pip>=23.0.0
  - pip:
    # Latest yfinance on purpose: Yahoo is an unofficial API and breaks
    # older client versions. Do NOT pin to the 0.2.40 in
    # 05-deployment-and-automation/requirements.txt.
    - yfinance>=0.2.60
    # Stooq + FRED readers — the fallbacks used by
    # 05-deployment-and-automation/scripts/data_repo.py.
    # Pinned: 0.11.x REMOVED Stooq support entirely, so
    # `pdr.get_data_stooq(...)` in data_repo.py raises AttributeError there.
    - pandas-datareader==0.10.0
